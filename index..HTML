<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldeão Estética Automotiva</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #333; 
        }
        .hero { 
            position: relative; 
            height: 100vh; 
            background: url('car_background.jpg') no-repeat center center/cover; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: #fff; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7); 
        }
        .hero::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
        }
        .logo, .hero-title { 
            position: relative; 
            z-index: 1; 
        }
        .logo { 
            width: 150px; 
            height: 150px; 
            background: #fff; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 40px; 
            font-weight: bold; 
            color: #333; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
        }
        .hero-title { 
            font-size: 3em; 
            margin: 0; 
            font-weight: bold; 
        }
        .services { 
            padding: 50px 20px; 
            background: #f4f4f4; 
        }
        .service-card { 
            background: #fff; 
            border-radius: 8px; 
            overflow: hidden; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: row-reverse; 
            align-items: center; 
        }
        .service-card img { 
            width: 50%; 
            height: 300px; 
            object-fit: cover; 
        }
        .service-content { 
            padding: 30px; 
            width: 50%; 
        }
        .service-title { 
            font-size: 2em; 
            margin-bottom: 15px; 
            color: #333; 
        }
        .service-description { 
            font-size: 1.1em; 
            color: #666; 
            line-height: 1.6; 
        }
        @media (max-width: 768px) { 
            .service-card { 
                flex-direction: column; 
            } 
            .service-card img { 
                width: 100%; 
                height: 200px; 
            } 
            .service-content { 
                width: 100%; 
            } 
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">A</div>
        <h1 class="hero-title">ALDEÃO</h1>
    </div>

    <div class="services">
        <div class="service-card">
            <img src="interior_car.jpg" alt="Interior do Carro">
            <div class="service-content">
                <h2 class="service-title">Lavagem Interna</h2>
                <p class="service-description">Lavagem de tapete, lavagem de interior, limpeza de interiores, tira poeira, tira sujeira e tira manchas.</p>
            </div>
        </div>
    </div>
</body>
</html>
